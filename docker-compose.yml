version: '3.8'

services:
  axel-remote-bot:
    build: .
    container_name: axel-remote-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3005}:${PORT:-3005}"
    volumes:
      - ./data:/app/data
    environment:
      # --- Configuración del Servidor ---
      - NODE_ENV=production
      - TZ=America/Lima
      - PORT=${PORT:-3005}

      # --- Telegram Bot ---
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID:-7233007906}

      # --- Agente PC Windows ---
      - PC_AGENT_TOKEN=${PC_AGENT_TOKEN}
      - PC_OFFLINE_THRESHOLD_SECONDS=${PC_OFFLINE_THRESHOLD_SECONDS:-35}

      # --- Directorio de Persistencia ---
      - DATA_DIR=/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
